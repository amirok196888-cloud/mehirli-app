name: Build blog preview
on:
  push:
    branches: [main]
    paths: ['blog/**', 'scripts/build-blog.cjs', '.github/workflows/blog.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-blog.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: blog-public-pages
          path: |
            blog/
            sitemap.xml

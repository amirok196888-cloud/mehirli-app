<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>מחירלי צילום הדרכה</title><style>*{box-sizing:border-box}body{margin:0;background:#06265b}iframe{border:0;width:100vw;height:100vh}.note{position:fixed;z-index:9;left:20px;right:20px;bottom:20px;padding:17px;background:#08264bed;color:white;border-radius:18px;text-align:center;font:bold 24px Arial;box-shadow:0 8px 30px #0008}</style></head><body><iframe id="app" src="app.html?capture-video=1"></iframe><div id="note" class="note"></div><script>
const mode=new URLSearchParams(location.search).get('step')||'form1',frame=document.querySelector('#app'),note=document.querySelector('#note');
frame.onload=()=>setTimeout(()=>{frame.style.height='5400px';const d=frame.contentDocument,w=frame.contentWindow;d.querySelectorAll('.view').forEach(x=>x.setAttribute('style','display:none!important'));d.querySelector('#installAppBtn')?.setAttribute('style','display:none!important');d.querySelector('#developerSupportLink')?.setAttribute('style','display:none!important');const hi=x=>x.setAttribute('style',(x.getAttribute('style')||'')+';outline:7px solid #ffd21f!important;outline-offset:5px;box-shadow:0 0 0 13px #ffd21f44!important');
if(mode.startsWith('form')){const v=d.querySelector('#proJobFormView');v.setAttribute('class',(v.getAttribute('class')||'')+' active');v.setAttribute('style','display:block!important;opacity:1!important;visibility:visible!important');d.querySelector('#proJobType').innerHTML='<option>תלייה והתקנה</option>';Object.entries({proCustomerName:'ישראל ישראלי',proCustomerPhone:'050-1234567',proCustomerCity:'חדרה',proJobDescription:'תליית טלוויזיה 65 אינץ וסידור הכבלים',proLaborHours:'2',proBasePrice:'700',proMaterialsCost:'100',proTravelCost:'50',proAssistantCost:'0',priceFloor:'850',proQuotedPrice:'850',proQuoteScope:'התקנה על קיר, חיבור הזרוע וסידור הכבלים.'}).forEach(([id,val])=>d.querySelector('#'+id).value=val);d.querySelector('#recommendedPrice').textContent='850 ₪';d.querySelector('#proSubtotal').textContent='850 ₪';d.querySelector('#proDiscountAmount').textContent='0 ₪';d.querySelector('.pricing-extras').open=true;const steps=d.querySelectorAll('.form-step');
if(mode==='form1'){hi(steps[0]);w.scrollTo(0,steps[0].offsetTop-80);note.textContent='1. ממלאים את שם הלקוח, הטלפון והעיר'}
if(mode==='form2'){hi(steps[1]);w.scrollTo(0,steps[1].offsetTop-80);note.textContent='2. בוחרים תחום ומתארים בקצרה את העבודה'}
if(mode==='form3'){hi(steps[2]);w.scrollTo(0,steps[2].offsetTop-80);note.textContent='3. בוחרים תמחור ומוסיפים את העלויות'}
if(mode==='form4'){let x=d.querySelector('.price-result');hi(x);w.scrollTo(0,x.offsetTop-280);note.textContent='מחירלי מחשבת את המחיר — ואפשר לשנות אותו'}
if(mode==='form5'){let x=d.querySelector('.flow-submit');hi(x);w.scrollTo(0,x.offsetTop-500);note.textContent='שומרים ועוברים לשליחת ההצעה ב-WhatsApp'}}
else{const v=d.querySelector('#publicQuoteView'),box=d.querySelector('#publicQuoteContent');v.setAttribute('class',(v.getAttribute('class')||'')+' active');v.setAttribute('style','display:block!important;opacity:1!important;visibility:visible!important');box.innerHTML='<div class="public-quote-brand">מחירלי <small>הצעת מחיר דיגיטלית</small></div><div class="card public-quote-card"><img class="public-business-logo" src="icon-192.png" alt="לוגו מחירלי"><div class="trade-badge handyman">🔨 הנדימן</div><span class="quote-number">הצעה מס׳ 1024</span><h2>שלום ישראל ישראלי</h2><p class="quote-intro">מחירלי עבודות לבית הכין עבורך הצעת מחיר.</p><div class="public-business-details"><b>מחירלי עבודות לבית</b><div>050-1234567</div></div><div class="quote-description"><small>עבור</small><b>תליית טלוויזיה 65 אינץ׳</b><p>התקנה על קיר, חיבור הזרוע וסידור הכבלים.</p></div><div class="quote-items-view"><div><span>התקנה וחיבור · 1</span><b>700 ₪</b></div><div><span>חומרים ונסיעה · 1</span><b>150 ₪</b></div></div><div class="public-price"><small>מחיר ההצעה</small><strong>850 ₪</strong></div><div class="terms-box">המחיר כולל עבודה, חומרים ונסיעה בהתאם לפירוט.</div><div class="public-document-actions"><button class="secondary big">📥 הורד PDF לטלפון</button><button class="secondary big">🖨️ פתח / הדפס PDF</button></div><label class="quote-approval-consent"><input type="checkbox"><span>אני מאשר/ת שקראתי את היקף העבודה, המחיר והתנאים.</span></label><button class="primary big">אישור הצעת המחיר</button><div class="public-contact-actions"><a class="secondary big pay-link">💬 WhatsApp לבעל העסק</a></div></div>';let x=mode==='actions'?d.querySelector('.public-document-actions'):d.querySelector('.public-quote-card');hi(x);w.scrollTo(0,mode==='actions'?x.offsetTop-250:0);note.textContent=mode==='actions'?'הלקוח יכול לאשר את ההצעה ולהוריד PDF':'כך נראית ההצעה האמיתית שהלקוח מקבל'}
},5200);
</script></body></html>

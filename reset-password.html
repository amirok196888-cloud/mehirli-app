<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>קביעת סיסמה חדשה — מחירלי</title>
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="stylesheet" href="style.css?v=77" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app-shell">
  <header class="topbar"><div class="brand"><img class="logo logo-img" src="icon-192.png" alt="מחירלי" /><div><h1>מחירלי</h1><p>איפוס סיסמה מאובטח</p></div></div></header>
  <main>
    <section class="view active">
      <div class="section-head"><div><span class="eyebrow">שחזור חשבון</span><h2>קביעת סיסמה חדשה</h2></div></div>
      <form id="resetForm" class="card form-card">
        <p id="intro">בודק את קישור האיפוס…</p>
        <div id="passwordFields" class="hidden">
          <label>סיסמה חדשה<input id="password" type="password" required minlength="8" autocomplete="new-password" /></label>
          <label>אימות הסיסמה<input id="confirmPassword" type="password" required minlength="8" autocomplete="new-password" /></label>
          <button id="saveBtn" class="primary big" type="submit">שמירת הסיסמה החדשה</button>
        </div>
        <p id="note" class="note"></p>
        <a id="backLink" class="secondary big pay-link hidden" href="app.html">חזרה לכניסה למחירלי</a>
      </form>
    </section>
  </main>
</div>
<script>
const SUPABASE_URL='https://jgnbcrlvsudfqfofmvlx.supabase.co';
const SUPABASE_KEY='sb_publishable_WnOhGZSlik7zqpO-cRYGvA_lOUz68Wp';
const recoveryIntent=new URLSearchParams(location.search).get('reset')==='1'||new URLSearchParams(location.search).has('code')||new URLSearchParams(location.hash.replace(/^#/,'')).get('type')==='recovery';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const form=document.querySelector('#resetForm'),fields=document.querySelector('#passwordFields'),intro=document.querySelector('#intro'),note=document.querySelector('#note'),back=document.querySelector('#backLink');
let recoveryReady=false;
function allowReset(){if(!recoveryIntent)return;recoveryReady=true;intro.textContent='בחרו סיסמה חדשה של 8 תווים לפחות.';fields.classList.remove('hidden');document.querySelector('#password').focus()}
function showInvalid(){if(recoveryReady)return;intro.textContent='קישור האיפוס אינו תקף או שפג תוקפו.';note.textContent='חזרו למסך הכניסה ובקשו קישור חדש.';back.classList.remove('hidden')}
db.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session)allowReset()});
(async()=>{const {data:{session}}=await db.auth.getSession();if(session&&recoveryIntent)allowReset();else setTimeout(showInvalid,1200)})();
form.addEventListener('submit',async event=>{
  event.preventDefault();if(!recoveryReady)return;
  const password=document.querySelector('#password').value,confirmation=document.querySelector('#confirmPassword').value,button=document.querySelector('#saveBtn');
  if(password.length<8){note.textContent='הסיסמה חייבת להכיל לפחות 8 תווים.';return}
  if(password!==confirmation){note.textContent='הסיסמאות אינן זהות.';return}
  button.disabled=true;note.textContent='שומר את הסיסמה החדשה…';
  const {error}=await db.auth.updateUser({password});
  if(error){button.disabled=false;note.textContent='לא ניתן לשמור את הסיסמה. בקשו קישור איפוס חדש.';return}
  await db.auth.signOut({scope:'local'});
  location.replace('app.html?password_reset=success');
});
</script>
</body>
</html>

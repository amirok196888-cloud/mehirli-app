  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#071b45;color:#fff;font-family:Arial,sans-serif}.box{max-width:520px;text-align:center}.logo{width:92px;height:92px;border-radius:25px;box-shadow:0 18px 45px #0005}.box h1{margin:20px 0 8px;font-size:32px}.box p{margin:0;color:#cbdaf2;line-height:1.6}.btn{display:inline-block;margin-top:22px;padding:14px 22px;border-radius:15px;background:#ffd738;color:#082350;text-decoration:none;font-weight:900}
  </style>
  <script>
    (function(){
      var token=new URLSearchParams(location.search).get('quote')||'';
      if(/^[0-9a-f-]{36}$/i.test(token)){
        location.replace('./app.html?quote='+encodeURIComponent(token));
      }
    })();
  </script>

<body>
  <main class="box">
    <img class="logo" src="icon-192.png" alt="מחירלי" />
    <h1>הצעת מחיר דיגיטלית</h1>
    <p>צפייה בפרטי ההצעה, אישור והורדת PDF לטלפון.</p>
    <a id="openQuote" class="btn" href="app.html">פתיחת ההצעה</a>
  </main>
  <script>
    var token=new URLSearchParams(location.search).get('quote')||'';
    if(/^[0-9a-f-]{36}$/i.test(token))document.getElementById('openQuote').href='app.html?quote='+encodeURIComponent(token);
  </script>
